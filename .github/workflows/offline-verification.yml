      - name: Verify pinned collection identity without running tests
        shell: bash
        run: |
          set -euo pipefail
          empty_home="$RUNNER_TEMP/futureeval-attribution-collection-home"
          mkdir -p "$empty_home/tmp"
          env -i PATH="$PATH" HOME="$empty_home" TMPDIR="$empty_home/tmp" LANG=C.UTF-8 PYTHONUTF8=1 \
            LITELLM_LOCAL_MODEL_COST_MAP=True python - <<'PY'
          import hashlib
          from collections import Counter, defaultdict
          import pytest

          class CollectionIdentity:
              def pytest_collection_finish(self, session):
                  nodeids = [item.nodeid for item in session.items]
                  counts = Counter(nodeids)
                  duplicates = {nodeid: count for nodeid, count in sorted(counts.items()) if count > 1}
                  folded = defaultdict(list)
                  for nodeid in sorted(nodeids):
                      folded[nodeid.casefold()].append(nodeid)
                  collisions = {key: values for key, values in sorted(folded.items()) if len(values) > 1}
                  unique_casefold = len(folded)
                  digest = hashlib.sha256(("\n".join(sorted(nodeids)) + "\n").encode("utf-8")).hexdigest()
                  expected_collisions = {
                      "tests/test_receipt_guard.py::test_invalid_cost_never_allows_another_post[false-nan]": [
                          "tests/test_receipt_guard.py::test_invalid_cost_never_allows_another_post[False-NaN]",
                          "tests/test_receipt_guard.py::test_invalid_cost_never_allows_another_post[False-nan]",
                      ],
                      "tests/test_receipt_guard.py::test_invalid_cost_never_allows_another_post[true-nan]": [
                          "tests/test_receipt_guard.py::test_invalid_cost_never_allows_another_post[True-NaN]",
                          "tests/test_receipt_guard.py::test_invalid_cost_never_allows_another_post[True-nan]",
                      ],
                  }
                  if len(nodeids) != 294 or len(counts) != 294 or duplicates:
                      raise AssertionError("pytest collection count or exact node-ID uniqueness changed")
                  if unique_casefold != 292 or collisions != expected_collisions:
                      raise AssertionError("case-fold collision evidence changed")
                  if digest != "f9eb354c599a3fd401278fbf4dde5c5e4df3929a0956a374a9df01471df1537d":
                      raise AssertionError("sorted pytest collection digest changed")
                  if any(not nodeid.startswith("tests/") for nodeid in nodeids):
                      raise AssertionError("collected node ID escaped the tests/ tree")
                  print("Collection identity matched: 294 exact unique IDs; 0 exact duplicates; 292 case-folded IDs; 2 case-fold collision groups.")
                  print(f"Sorted node-ID SHA-256: {digest}")

          raise SystemExit(pytest.main(["tests", "--collect-only", "-q"], plugins=[CollectionIdentity()]))
          PY

      - name: Run complete offline verifier without credentials
        shell: bash
        run: |
          set -euo pipefail
          empty_home="$RUNNER_TEMP/futureeval-attribution-empty-home"
