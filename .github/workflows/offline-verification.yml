  verify-pr14-delivery-proof:
    if: github.event.pull_request.number == 14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONUTF8: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact PR head without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Assert exact PR14 base, tree, paths, and accepted source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PR_NUMBER" = "14"
          test "$GITHUB_BASE_REF" = "main"
          approved_base='ef4897da51bb915deefafd6701961c14ed9d7f1b'
          approved_base_tree='a0b9aba4aaa52585580ba2577341d99ce127ec74'
          published_pr14_head='c6588cba34700aebec50a6d02d6f9bd1f22e7da7'
          accepted_followup_head='e2dfb0cbd8e6273f67a8f0b92ca79cc7bcaf6e1c'
          readiness_history='f0a423142e6ccb499ba483fe769b8cfcb8e88b30'
          test "$EXPECTED_BASE_SHA" = "$approved_base"
          git fetch --no-tags --depth=1 origin "$approved_base"
          git fetch --no-tags --depth=1 origin "$readiness_history"
          test "$(git rev-parse "${approved_base}^{tree}")" = "$approved_base_tree"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$accepted_followup_head"
          test "$(git rev-parse HEAD^^)" = "$published_pr14_head"
          test "$(git rev-parse HEAD^^^)" = "$approved_base"
          test "$(git merge-base "$approved_base" HEAD)" = "$approved_base"
          expected_child_paths=$'.github/workflows/offline-verification.yml\nfutureeval_bot/__main__.py\nfutureeval_bot/api.py\nfutureeval_bot/core.py\ntests/test_delivery_proof.py'
          actual_child_paths="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD | LC_ALL=C sort)"
          test "$actual_child_paths" = "$expected_child_paths"
          expected_paths=$'.github/workflows/offline-verification.yml\nfutureeval_bot/__main__.py\nfutureeval_bot/api.py\nfutureeval_bot/core.py\nfutureeval_bot/operational_summary.py\ntests/test_bot.py\ntests/test_delivery_proof.py\ntests/test_inventory.py\ntests/test_operational_summary_v2.py\ntests/test_rate_limit_circuit.py'
          actual_paths="$(git diff --name-only "$approved_base"...HEAD | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          # Hashes are over LF-normalized bytes so Windows checkout conversion cannot
          # change the identity of the accepted candidate source.
          expected = {
              'futureeval_bot/api.py': '82cf7725591c534bba095bc95600b7c556950cbf680ee2334caa65971cfb5f2f',
              'futureeval_bot/core.py': 'cea514411295df04c803d618bbfcc0cc6a9d9e2621bc1b801c80c75047cd4139',
              'futureeval_bot/operational_summary.py': '418c351a7eed2d054788827ffcf81bffeb95a061052a17e24b518a98f84db65b',
              'futureeval_bot/__main__.py': '506d94429ee1f82387a2dd8f062cbca3d3366aaf5c593e2336f6d17231d9a05e',
              'tests/test_bot.py': '92d13d41bf06aaa260032a75f9e5e18093fe6bb8f1833fc43a69aedb6683a182',
              'tests/test_delivery_proof.py': '38a8bf05eed814f9e15440880fa20dd20cc146f62eea61e966c7174fa156eeb4',
              'tests/test_inventory.py': 'bb56ce28691be32b049f3b099a37bfa1d75b2a284defddf83e3835a806abe2bc',
              'tests/test_operational_summary_v2.py': '5a4540f758c0940f6f877ffadd44c47a7b39b7481d0ea44d7ac581b011365ad4',
              'tests/test_rate_limit_circuit.py': '2fa7353b0c3c31e1dbbbe2dcae52eec2e09d1ff8f4d07f474287e9095d9611b3',
          }
          for name, wanted in expected.items():
              path = Path(name)
              actual = hashlib.sha256(path.read_bytes().replace(b'\r\n', b'\n')).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'accepted source hash mismatch: {name}')
          PY
          printf 'PR #14 head: %s\nApproved base: %s\nApproved base tree: %s\n' "$actual_head" "$approved_base" "$approved_base_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove stale verifier records
        run: rm -f outputs/offline-verification.json work/offline-tests.xml; mkdir -p outputs work

      - name: Run complete offline verifier
        run: python scripts/verify.py

      - name: Validate complete current-tree verification report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from futureeval_bot.core import Config, source_hashes

          report_path = Path('outputs/offline-verification.json')
          junit_path = Path('work/offline-tests.xml')
          if not report_path.is_file() or not junit_path.is_file():
              raise SystemExit('complete offline verification evidence is missing')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          cases = list(ET.parse(junit_path).iter('testcase'))
          checks = report.get('checks')
          if report.get('passed') is not True:
              raise SystemExit('complete offline verifier did not pass')
          if report.get('source_hashes') != source_hashes():
              raise SystemExit('source_hashes do not match the integrated checkout')
          if report.get('config_fingerprint') != Config.load('config.json').fingerprint:
              raise SystemExit('config_fingerprint does not match the integrated checkout')
          if type(report.get('test_count')) is not int or report['test_count'] != len(cases):
              raise SystemExit('report test count does not match collected JUnit cases')
          if not isinstance(checks, list) or len(checks) != len(cases):
              raise SystemExit('report checks do not match collected JUnit cases')
          if any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('one or more tests failed, errored, or skipped')
          if any(not isinstance(item, dict) or item.get('passed') is not True for item in checks):
              raise SystemExit('one or more report checks failed or are malformed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"\n## Full offline verification\n\n- Test cases: {len(cases)}\n- Result: all passed, none skipped\n- Source hashes: match integrated checkout\n- Configuration fingerprint: match integrated checkout\n")
          PY

  verify-pr15-summary-categories:
    if: github.event.pull_request.number == 15
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONUTF8: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
      ACCEPTED_PARENT_SHA: d8cf8d21106f4974b331669ec1ef6d9c5ee7a4ab
      ACCEPTED_BASE_SHA: 8ce385fc68f9d0fa3ecd157b7f2706b1b0d4d28b
      PUBLISHED_FOLLOWUP_SHA: b7979fb0871c539aefd9ad873a1d664f37b5d2b5
      PUBLISHED_FOLLOWUP_OFFLINE_WORKFLOW_BLOB: 2d79a9a66809d92e5720fec0b14124d302dbe825
      PUBLISHED_FOLLOWUP_DIAGNOSTICS_WORKFLOW_BLOB: 43330f2af1b68c9ce52a99231c14becf0042259c
      PUBLISHED_FOLLOWUP_TEST_BLOB: c937f013dc1b7dae795945c273320b2c9e8e854c
      ACCEPTED_BASE_SOURCE_BLOB: 1903e3f91fb39216d2be16c3855651629a2d8479
      ACCEPTED_SOURCE_BLOB: cb3fde067f6b9594c69e3cd243dd6aa9445a3aca
      HISTORICAL_READINESS_COMMIT: f0a423142e6ccb499ba483fe769b8cfcb8e88b30
      HISTORICAL_READINESS_TREE: 6aab6dd6cb39d5feeebf6cf1f47a9e6f07309fd5
    steps:
      - name: Check out exact PR head without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Assert PR15 parent, accepted source bytes, and exact changed-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PR_NUMBER" = "15"
          test "$GITHUB_BASE_REF" = "main"
          test "$EXPECTED_BASE_SHA" = "$ACCEPTED_BASE_SHA"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$PUBLISHED_FOLLOWUP_SHA"
          test "$(git rev-parse HEAD^^)" = "$ACCEPTED_PARENT_SHA"
          test "$(git rev-parse HEAD^^^)" = "$ACCEPTED_BASE_SHA"
          test "$(git rev-parse "$ACCEPTED_BASE_SHA:futureeval_bot/operational_summary.py")" = "$ACCEPTED_BASE_SOURCE_BLOB"
          test "$(git rev-parse "$ACCEPTED_PARENT_SHA:futureeval_bot/operational_summary.py")" = "$ACCEPTED_SOURCE_BLOB"
          test "$(git rev-parse "$PUBLISHED_FOLLOWUP_SHA:futureeval_bot/operational_summary.py")" = "$ACCEPTED_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:futureeval_bot/operational_summary.py")" = "$ACCEPTED_SOURCE_BLOB"
          test "$(git rev-parse "$PUBLISHED_FOLLOWUP_SHA:.github/workflows/offline-verification.yml")" = "$PUBLISHED_FOLLOWUP_OFFLINE_WORKFLOW_BLOB"
          test "$(git rev-parse "$PUBLISHED_FOLLOWUP_SHA:.github/workflows/readiness-diagnostics-offline-verification.yml")" = "$PUBLISHED_FOLLOWUP_DIAGNOSTICS_WORKFLOW_BLOB"
          test "$(git rev-parse "$PUBLISHED_FOLLOWUP_SHA:tests/test_operational_summary_pr15_ci.py")" = "$PUBLISHED_FOLLOWUP_TEST_BLOB"
          # Authenticate the one older tree required by unchanged baseline tests before egress is blocked.
          git fetch --no-tags --depth=1 origin "$HISTORICAL_READINESS_COMMIT"
          test "$(git rev-parse "$HISTORICAL_READINESS_COMMIT^{commit}")" = "$HISTORICAL_READINESS_COMMIT"
          test "$(git rev-parse "$HISTORICAL_READINESS_COMMIT^{tree}")" = "$HISTORICAL_READINESS_TREE"
          source_paths='futureeval_bot/operational_summary.py'
          actual_source_paths="$(git diff --name-only "$ACCEPTED_BASE_SHA" "$ACCEPTED_PARENT_SHA" | LC_ALL=C sort)"
          test "$actual_source_paths" = "$source_paths"
          prior_ci_paths=$'.github/workflows/offline-verification.yml\n.github/workflows/readiness-diagnostics-offline-verification.yml\ntests/test_operational_summary_pr15_ci.py'
          actual_prior_ci_paths="$(git diff-tree --no-commit-id --name-only -r "$PUBLISHED_FOLLOWUP_SHA^" "$PUBLISHED_FOLLOWUP_SHA" | LC_ALL=C sort)"
          test "$actual_prior_ci_paths" = "$prior_ci_paths"
          current_ci_paths='.github/workflows/offline-verification.yml'
          actual_current_ci_paths="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD | LC_ALL=C sort)"
          test "$actual_current_ci_paths" = "$current_ci_paths"
          expected_paths=$'.github/workflows/offline-verification.yml\n.github/workflows/readiness-diagnostics-offline-verification.yml\nfutureeval_bot/operational_summary.py\ntests/test_operational_summary_pr15_ci.py'
          actual_paths="$(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          printf 'PR15: %s\nAccepted source parent: %s\nApproved main base: %s\n' "$actual_head" "$ACCEPTED_PARENT_SHA" "$ACCEPTED_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Block new outbound traffic during verification
        shell: bash
        run: |
          set -euo pipefail
          command -v iptables
          command -v ip6tables
          tag="futureeval-pr15-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
