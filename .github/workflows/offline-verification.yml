name: PR9 offline release verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/offline-verification.yml'
      - 'config.json'
      - 'requirements.txt'
      - 'futureeval_bot/**'
      - 'scripts/verify.py'
      - 'tests/**'

permissions:
  contents: read

jobs:
  verify-pr9:
    if: github.event.pull_request.number == 9
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONUTF8: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Assert exact head, parent, changed path, and reviewed source blobs
        run: |
          set -euo pipefail
          test "$EXPECTED_PR_NUMBER" = "9"
          actual_head="$(git rev-parse HEAD)"
          expected_parent="71137170a2ce1200b0ac32883b060c24a3e2e54c"
          actual_parent="$(git rev-parse HEAD^)"
          changed_paths="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$actual_parent" = "$expected_parent"
          test "$changed_paths" = ".github/workflows/offline-verification.yml"
          printf 'PR #9 exact head: %s\nParent: %s\nWorkflow run ID: %s\n' "$actual_head" "$actual_parent" "$GITHUB_RUN_ID"
          {
            echo "## Run identity"
            echo "- PR: #9"
            echo "- Head SHA: $actual_head"
            echo "- Parent SHA: $actual_parent"
            echo "- Workflow run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git rev-parse "HEAD:$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Reviewed blob mismatch for $path: $actual" >&2
              exit 1
            fi
          }
          check_blob 8da52b76fd78f413a45275cb4f8718df21e33597 futureeval_bot/cloud.py
          check_blob 304b0096e68309f7c81a8455d0fe39e033802607 futureeval_bot/core.py
          check_blob e1dbe9e6fc4f5f43dc2587284e9ccd62a703b8eb tests/test_checkpoint_read_stability.py
          check_blob 4b6b6c95b3f6938f5835bcbad4950eacccaa0101 tests/test_immutable_read.py
          check_blob b801b66111cb4f6374e402575d142994f7f18a79 requirements.txt
          check_blob e2c4e8f990e74f816dd230e486eb229c5304acaa config.json
          check_blob 6e13805047ca875879051a4d552380a787e03847 scripts/verify.py
          check_blob 984b1179eff6b01dd8e890004472de684f72e408 tests/conftest.py

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Record Python and resolved package versions
        run: |
          {
            echo "## Runtime and resolved dependencies"
            echo 'Python:'
            python --version
            echo 'pip:'
            python -m pip --version
            echo 'pip freeze:'
            python -m pip freeze
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove stale verifier records
        run: |
          rm -f outputs/offline-verification.json work/offline-tests.xml
          mkdir -p outputs work

      - name: Run complete offline verifier
        run: python scripts/verify.py

      - name: Validate and retain complete offline-verification.json
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from futureeval_bot.core import Config, source_hashes

          path = Path('outputs/offline-verification.json')
          if not path.is_file():
              raise SystemExit('offline-verification.json was not produced')
          report = json.loads(path.read_text(encoding='utf-8'))
          summary_path = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary_path, 'a', encoding='utf-8') as summary:
              summary.write('## Complete offline-verification.json\\n\\n```json\\n')
              summary.write(path.read_text(encoding='utf-8'))
              summary.write('\\n```\\n')
          if report.get('source_hashes') != source_hashes():
              raise SystemExit('source_hashes do not match the current checkout')
          if report.get('config_fingerprint') != Config.load('config.json').fingerprint:
              raise SystemExit('config_fingerprint does not match the current checkout')
          checks = report.get('checks')
          if report.get('passed') is not True:
              raise SystemExit('offline-verification.json passed is not true')
          if report.get('test_count') != 215 or not isinstance(checks, list) or len(checks) != 215:
              raise SystemExit('expected exactly 215 collected tests on this exact tree')
          if any(not isinstance(item, dict) or item.get('passed') is not True for item in checks):
              raise SystemExit('one or more collected tests failed, skipped, or are missing')
          PY

  verify-pr10:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONUTF8: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Assert PR #10 identity and reviewed source blobs
        run: |
          set -euo pipefail
          test "$EXPECTED_PR_NUMBER" = "10"
          test "$GITHUB_BASE_REF" = "main"
          test "$EXPECTED_BASE_SHA" = "9b74668da3d3496d4e3612fac8aa96beead7da64"
          actual_head="$(git rev-parse HEAD)"
          actual_parent="$(git rev-parse HEAD^)"
          changed_paths="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$actual_parent" = "4fbcd0ecdb707113bd2998b9ad48af1cbb60400b"
          test "$changed_paths" = ".github/workflows/offline-verification.yml"
          printf 'PR #10 exact head: %s\nParent: %s\nWorkflow run ID: %s\n' "$actual_head" "$actual_parent" "$GITHUB_RUN_ID"
          { echo "## Run identity"; echo "- PR: #10"; echo "- Head SHA: $actual_head"; echo "- Parent SHA: $actual_parent"; echo "- Workflow run ID: $GITHUB_RUN_ID"; } >> "$GITHUB_STEP_SUMMARY"
          check_blob() { actual="$(git rev-parse "HEAD:$2")"; test "$actual" = "$1" || { echo "Reviewed blob mismatch for $2: $actual" >&2; exit 1; }; }
          check_blob 9a6a746d56f001a8249f92b526eec1ec95a3ac18 futureeval_bot/__main__.py
          check_blob 726b2ffdebeda55b7238a097517d28928dd07426 futureeval_bot/api.py
          check_blob 6b4c557fc6bc07766ee1076c35832da37e52ad08 futureeval_bot/forecast.py
          check_blob e89aee7bf63d7a7c7bff2e8c973b9043081089ff tests/test_rate_limit_circuit.py
          check_blob ea20497c0d5058853635ce594b7ac4c40fcc8ab7 tests/test_bot.py
          check_blob b31b6315bbc0442e88b599e1115f73de4927852c tests/test_failure_diagnostics.py
          check_blob 67e07b4041751a91e264df155371474b10eef625 tests/test_overflow_guard.py
          check_blob 8da52b76fd78f413a45275cb4f8718df21e33597 futureeval_bot/cloud.py
          check_blob 304b0096e68309f7c81a8455d0fe39e033802607 futureeval_bot/core.py
          check_blob b801b66111cb4f6374e402575d142994f7f18a79 requirements.txt
          check_blob e2c4e8f990e74f816dd230e486eb229c5304acaa config.json
          check_blob 6e13805047ca875879051a4d552380a787e03847 scripts/verify.py
          check_blob 984b1179eff6b01dd8e890004472de684f72e408 tests/conftest.py
          check_blob e1dbe9e6fc4f5f43dc2587284e9ccd62a703b8eb tests/test_checkpoint_read_stability.py
          check_blob 4b6b6c95b3f6938f5835bcbad4950eacccaa0101 tests/test_immutable_read.py
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Record Python and resolved package versions
        run: |
          { echo "## Runtime and resolved dependencies"; echo 'Python:'; python --version; echo 'pip:'; python -m pip --version; echo 'pip freeze:'; python -m pip freeze; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove stale verifier records
        run: rm -f outputs/offline-verification.json work/offline-tests.xml; mkdir -p outputs work
      - name: Run complete offline verifier
        run: python scripts/verify.py
      - name: Validate and retain complete offline-verification.json
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from futureeval_bot.core import Config, source_hashes
          path = Path('outputs/offline-verification.json')
          if not path.is_file(): raise SystemExit('offline-verification.json was not produced')
          report = json.loads(path.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Complete offline-verification.json\\n\\n```json\\n')
              summary.write(path.read_text(encoding='utf-8'))
              summary.write('\\n```\\n')
          if report.get('source_hashes') != source_hashes(): raise SystemExit('source_hashes do not match the current checkout')
          if report.get('config_fingerprint') != Config.load('config.json').fingerprint: raise SystemExit('config_fingerprint does not match the current checkout')
          checks = report.get('checks')
          if report.get('passed') is not True: raise SystemExit('offline-verification.json passed is not true')
          if report.get('test_count') != 224 or not isinstance(checks, list) or len(checks) != 224: raise SystemExit('expected exactly 224 collected tests on this exact tree')
          if any(not isinstance(item, dict) or item.get('passed') is not True for item in checks): raise SystemExit('one or more collected tests failed, skipped, or are missing')
          PY

  verify-pr14-delivery-proof:
    if: github.event.pull_request.number == 14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONUTF8: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact PR head without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Assert exact PR14 base, tree, paths, and accepted source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PR_NUMBER" = "14"
          test "$GITHUB_BASE_REF" = "main"
          approved_base='ef4897da51bb915deefafd6701961c14ed9d7f1b'
          approved_base_tree='a0b9aba4aaa52585580ba2577341d99ce127ec74'
          test "$EXPECTED_BASE_SHA" = "$approved_base"
          git fetch --no-tags --depth=1 origin "$approved_base"
          test "$(git rev-parse "${approved_base}^{tree}")" = "$approved_base_tree"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$approved_base" HEAD)" = "$approved_base"
          expected_paths=$'.github/workflows/offline-verification.yml\nfutureeval_bot/__main__.py\nfutureeval_bot/api.py\nfutureeval_bot/core.py\nfutureeval_bot/operational_summary.py\ntests/test_delivery_proof.py'
          actual_paths="$(git diff --name-only "$approved_base"...HEAD | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          # Hashes are over LF-normalized bytes so Windows checkout conversion cannot
          # change the identity of the accepted candidate source.
          expected = {
              'futureeval_bot/api.py': 'e04a1808707f8c5dd2a95e8871cec90fdf1f964dc9d88daf1277012866411f81',
              'futureeval_bot/core.py': '853ba288d1bdc56a158c5bb7ff694968051c10a9f6cc5a9b255c03e9afd0294d',
              'futureeval_bot/operational_summary.py': '418c351a7eed2d054788827ffcf81bffeb95a061052a17e24b518a98f84db65b',
              'futureeval_bot/__main__.py': 'b2a43bcd427144d44d04207def8a27be87c7ec0079588a85e25912231ef10db5',
              'tests/test_delivery_proof.py': '2b8da1fb43354fef0067b62e4d03c68874d7a1a2f85ee86c14427ae2c706a4ca',
          }
          for name, wanted in expected.items():
              path = Path(name)
              actual = hashlib.sha256(path.read_bytes().replace(b'\r\n', b'\n')).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'accepted source hash mismatch: {name}')
          PY
          printf 'PR #14 head: %s\nApproved base: %s\nApproved base tree: %s\n' "$actual_head" "$approved_base" "$approved_base_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove stale verifier records
        run: rm -f outputs/offline-verification.json work/offline-tests.xml; mkdir -p outputs work

      - name: Run complete offline verifier
        run: python scripts/verify.py

      - name: Validate complete current-tree verification report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from futureeval_bot.core import Config, source_hashes

          report_path = Path('outputs/offline-verification.json')
          junit_path = Path('work/offline-tests.xml')
          if not report_path.is_file() or not junit_path.is_file():
              raise SystemExit('complete offline verification evidence is missing')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          cases = list(ET.parse(junit_path).iter('testcase'))
          checks = report.get('checks')
          if report.get('passed') is not True:
              raise SystemExit('complete offline verifier did not pass')
          if report.get('source_hashes') != source_hashes():
              raise SystemExit('source_hashes do not match the integrated checkout')
          if report.get('config_fingerprint') != Config.load('config.json').fingerprint:
              raise SystemExit('config_fingerprint does not match the integrated checkout')
          if type(report.get('test_count')) is not int or report['test_count'] != len(cases):
              raise SystemExit('report test count does not match collected JUnit cases')
          if not isinstance(checks, list) or len(checks) != len(cases):
              raise SystemExit('report checks do not match collected JUnit cases')
          if any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('one or more tests failed, errored, or skipped')
          if any(not isinstance(item, dict) or item.get('passed') is not True for item in checks):
              raise SystemExit('one or more report checks failed or are malformed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"\n## Full offline verification\n\n- Test cases: {len(cases)}\n- Result: all passed, none skipped\n- Source hashes: match integrated checkout\n- Configuration fingerprint: match integrated checkout\n")
          PY
