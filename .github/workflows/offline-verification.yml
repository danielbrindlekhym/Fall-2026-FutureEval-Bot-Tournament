          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from futureeval_bot.core import Config, source_hashes

          report_path = Path('outputs/offline-verification.json')
          junit_path = Path('work/offline-tests.xml')
          if not report_path.is_file() or not junit_path.is_file():
              raise SystemExit('complete offline verification evidence is missing')
          report_bytes = report_path.read_bytes()
          junit_bytes = junit_path.read_bytes()
          report = json.loads(report_bytes)
          cases = list(ET.parse(junit_path).iter('testcase'))
          checks = report.get('checks')
          expected = int(os.environ['EXPECTED_TEST_CASES'])
          if report.get('passed') is not True:
              raise SystemExit('complete offline verifier did not pass')
          if report.get('source_hashes') != source_hashes():
              raise SystemExit('source hashes do not match the exact checkout')
          if report.get('config_fingerprint') != Config.load('config.json').fingerprint:
              raise SystemExit('configuration fingerprint does not match the exact checkout')
          if len(cases) != expected or type(report.get('test_count')) is not int or report['test_count'] != expected:
              raise SystemExit('full-suite test count does not match the independently reviewed collection')
          if not isinstance(checks, list) or len(checks) != expected:
              raise SystemExit('report checks do not match the expected collected JUnit cases')
          if [item.get('name') if isinstance(item, dict) else None for item in checks] != [case.attrib.get('name') for case in cases]:
              raise SystemExit('report check names do not match JUnit case names')
          if any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('one or more tests failed, errored, or skipped')
          if any(not isinstance(item, dict) or item.get('passed') is not True for item in checks):
              raise SystemExit('one or more report checks failed or are malformed')
          required_attribution = {
              'tests/test_operational_summary.py::test_exact_operation_binds_only_its_run_attempt_and_source',
              'tests/test_operational_summary.py::test_missing_mismatched_or_stale_identity_is_unknown_not_zero',
              'tests/test_operational_summary.py::test_legacy_checkpoint_schema_compares_as_empty_additive_tables',
              'tests/test_operational_summary.py::test_delivery_proof_mutation_changes_checkpoint_signature',
              'tests/test_operational_summary.py::test_no_validated_forecast_is_published_as_validation_failure',
              'tests/test_operational_summary.py::test_incomplete_reservation_is_counted_but_cost_and_request_stay_unknown',
              'tests/test_operational_summary.py::test_complete_zero_reservations_are_instrumented_zero_not_no_remote_effects',
              'tests/test_operational_summary.py::test_partial_receipts_and_missing_server_times_are_not_on_time_pairs',
              'tests/test_operational_summary.py::test_valid_pair_on_time_late_and_unknown_deadline_are_distinguished',
              'tests/test_operational_summary.py::test_missing_summary_can_be_reconstructed_from_durable_bound_ledger',
              'tests/test_operational_summary.py::test_output_uses_allowlisted_counts_and_fixed_failure_categories_only',
          }
          observed_attribution = {
              f"{case.attrib.get('file')}::{case.attrib.get('name')}"
              for case in cases
              if case.attrib.get('file') == 'tests/test_operational_summary.py'
          }
          if observed_attribution != required_attribution:
              raise SystemExit('attribution JUnit cases differ from the 11 reviewed collection node IDs')
          report_hash = hashlib.sha256(report_bytes).hexdigest()
          junit_hash = hashlib.sha256(junit_bytes).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"\n## Future-run attribution offline verification\n\n- PR: #{os.environ['EXPECTED_PR_NUMBER']}\n- Head: {os.environ['EXPECTED_HEAD_SHA']}\n- Base: {os.environ['EXPECTED_BASE_SHA']}\n- Test cases: {len(cases)}; all passed, none skipped\n- Attribution cases: {len(observed_attribution)} required node IDs present\n- Source/configuration identities: matched exact checkout\n- Report SHA-256: {report_hash}\n- JUnit SHA-256: {junit_hash}\n")
          PY

      - name: Restore only this job's temporary outbound rules
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tag="futureeval-attribution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remove_owned_rule() {
            local tool="$1"
            local marker="$2"
            shift 2
            local saved count
            saved="$(sudo "${tool}-save" -t filter)"
            count="$(grep -F -c -- "$marker" <<< "$saved" || true)"
            if [[ "$count" == 0 ]]; then return 0; fi
            if [[ "$count" != 1 ]]; then
              echo "Expected at most one owned firewall rule for ${marker}; found ${count}." >&2
              return 1
            fi
            sudo "$tool" -D OUTPUT "$@"
            saved="$(sudo "${tool}-save" -t filter)"
            if grep -Fq -- "$marker" <<< "$saved"; then
              echo "Owned firewall rule remains after cleanup: ${marker}." >&2
              return 1
            fi
          }
          remove_owned_rule iptables "${tag}-v4-lo" -o lo -m comment --comment "${tag}-v4-lo" -j ACCEPT
          remove_owned_rule iptables "${tag}-v4-established" -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment "${tag}-v4-established" -j ACCEPT
          remove_owned_rule iptables "${tag}-v4-reject" -m comment --comment "${tag}-v4-reject" -j REJECT
          remove_owned_rule ip6tables "${tag}-v6-lo" -o lo -m comment --comment "${tag}-v6-lo" -j ACCEPT
          remove_owned_rule ip6tables "${tag}-v6-established" -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment "${tag}-v6-established" -j ACCEPT
          remove_owned_rule ip6tables "${tag}-v6-reject" -m comment --comment "${tag}-v6-reject" -j REJECT

  verify-pagination-full-offline:
    if: github.event.pull_request.number == 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONUTF8: '1'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
      ACCEPTED_BASE_SHA: db047debfb473f31bb12a4ca2a0a00f6ce025b11
      ACCEPTED_BASE_TREE: 8de8764527e715ef61077cd9ecc385e226d39383
      ACCEPTED_API_BLOB: ada383ad9cc696f9d2cfa4492dd67dba6229d2be
      ACCEPTED_TEST_INVENTORY_BLOB: 67af8923e513b119c6e9511cfab23b4bc457d390
      ACCEPTED_INTEGRATION_TEST_BLOB: 15103389c100f0dd555489113e1babf31dbfac13
      EXPECTED_TEST_CASES: '282'
      HISTORICAL_READINESS_COMMIT: f0a423142e6ccb499ba483fe769b8cfcb8e88b30
      HISTORICAL_READINESS_TREE: 6aab6dd6cb39d5feeebf6cf1f47a9e6f07309fd5
    steps:
      - name: Check out exact PR head without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Assert exact PR16 ancestry, accepted blobs, and four-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PR_NUMBER" = "16"
          test "$GITHUB_BASE_REF" = "main"
          test "$EXPECTED_BASE_SHA" = "$ACCEPTED_BASE_SHA"
          test "$(git rev-parse "$ACCEPTED_BASE_SHA^{tree}")" = "$ACCEPTED_BASE_TREE"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$ACCEPTED_BASE_SHA"
          test "$(git rev-parse HEAD:futureeval_bot/api.py)" = "$ACCEPTED_API_BLOB"
          test "$(git rev-parse HEAD:tests/test_inventory.py)" = "$ACCEPTED_TEST_INVENTORY_BLOB"
          test "$(git rev-parse HEAD:tests/test_pagination_inventory_integration.py)" = "$ACCEPTED_INTEGRATION_TEST_BLOB"
          git fetch --no-tags --depth=1 origin "$HISTORICAL_READINESS_COMMIT"
          test "$(git rev-parse "$HISTORICAL_READINESS_COMMIT^{commit}")" = "$HISTORICAL_READINESS_COMMIT"
          test "$(git rev-parse "$HISTORICAL_READINESS_COMMIT^{tree}")" = "$HISTORICAL_READINESS_TREE"
          expected_paths=$'.github/workflows/offline-verification.yml\nfutureeval_bot/api.py\ntests/test_inventory.py\ntests/test_pagination_inventory_integration.py'
          actual_paths="$(git diff --name-only "$ACCEPTED_BASE_SHA" HEAD | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          printf 'PR16 candidate head: %s\nAccepted main base: %s\n' "$actual_head" "$ACCEPTED_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned direct dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove stale verifier records
        run: rm -f outputs/offline-verification.json work/offline-tests.xml; mkdir -p outputs work

      - name: Block new outbound traffic during verification
        shell: bash
        run: |
          set -euo pipefail
          command -v iptables
          command -v ip6tables
          tag="futureeval-pagination-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo iptables -I OUTPUT 1 -o lo -m comment --comment "${tag}-v4-lo" -j ACCEPT
          sudo iptables -I OUTPUT 2 -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment "${tag}-v4-established" -j ACCEPT
          sudo iptables -I OUTPUT 3 -m comment --comment "${tag}-v4-reject" -j REJECT
          sudo ip6tables -I OUTPUT 1 -o lo -m comment --comment "${tag}-v6-lo" -j ACCEPT
          sudo ip6tables -I OUTPUT 2 -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment "${tag}-v6-established" -j ACCEPT
          sudo ip6tables -I OUTPUT 3 -m comment --comment "${tag}-v6-reject" -j REJECT

      - name: Run complete offline verifier without credentials
        shell: bash
        run: |
          set -euo pipefail
          empty_home="$RUNNER_TEMP/futureeval-empty-home"
          mkdir -p "$empty_home"
          env -i PATH="$PATH" HOME="$empty_home" LANG=C.UTF-8 PYTHONUTF8=1 \
            LITELLM_LOCAL_MODEL_COST_MAP=True python scripts/verify.py

      - name: Validate exact full offline report and JUnit evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from futureeval_bot.core import Config, source_hashes

          report_path = Path('outputs/offline-verification.json')
          junit_path = Path('work/offline-tests.xml')
          if not report_path.is_file() or not junit_path.is_file():
              raise SystemExit('complete offline verification evidence is missing')
          report_bytes = report_path.read_bytes()
          junit_bytes = junit_path.read_bytes()
          report = json.loads(report_bytes)
          cases = list(ET.parse(junit_path).iter('testcase'))
          checks = report.get('checks')
          expected = int(os.environ['EXPECTED_TEST_CASES'])
          if report.get('passed') is not True:
              raise SystemExit('complete offline verifier did not pass')
          if report.get('source_hashes') != source_hashes():
              raise SystemExit('source hashes do not match the exact checkout')
          if report.get('config_fingerprint') != Config.load('config.json').fingerprint:
              raise SystemExit('configuration fingerprint does not match the exact checkout')
          if len(cases) != expected or type(report.get('test_count')) is not int or report['test_count'] != expected:
              raise SystemExit('full-suite test count does not match the accepted PR15 baseline plus eight cases')
          if not isinstance(checks, list) or len(checks) != expected:
              raise SystemExit('report checks do not match the expected collected JUnit cases')
          if any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')):
              raise SystemExit('one or more tests failed, errored, or skipped')
          if any(not isinstance(item, dict) or item.get('passed') is not True for item in checks):
              raise SystemExit('one or more report checks failed or are malformed')
          report_hash = hashlib.sha256(report_bytes).hexdigest()
          junit_hash = hashlib.sha256(junit_bytes).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"\n## Full offline verification\n\n- PR: #16\n- Head: {os.environ['EXPECTED_HEAD_SHA']}\n- Base: {os.environ['EXPECTED_BASE_SHA']}\n- Test cases: {len(cases)}; all passed, none skipped\n- Source/configuration identities: matched exact checkout\n- Report SHA-256: {report_hash}\n- JUnit SHA-256: {junit_hash}\n")
          PY

      - name: Restore only this job's temporary outbound rules
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tag="futureeval-pagination-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remove_owned_rule() {
            local tool="$1"
            local marker="$2"
            shift 2
            local saved count
            saved="$(sudo "${tool}-save" -t filter)"
            count="$(grep -F -c -- "$marker" <<< "$saved" || true)"
            if [[ "$count" == 0 ]]; then return 0; fi
            if [[ "$count" != 1 ]]; then
              echo "Expected at most one owned firewall rule for ${marker}; found ${count}." >&2
              return 1
            fi
            sudo "$tool" -D OUTPUT "$@"
            saved="$(sudo "${tool}-save" -t filter)"
            if grep -Fq -- "$marker" <<< "$saved"; then
              echo "Owned firewall rule remains after cleanup: ${marker}." >&2
              return 1
            fi
          }
          remove_owned_rule iptables "${tag}-v4-lo" -o lo -m comment --comment "${tag}-v4-lo" -j ACCEPT
          remove_owned_rule iptables "${tag}-v4-established" -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment "${tag}-v4-established" -j ACCEPT
          remove_owned_rule iptables "${tag}-v4-reject" -m comment --comment "${tag}-v4-reject" -j REJECT
          remove_owned_rule ip6tables "${tag}-v6-lo" -o lo -m comment --comment "${tag}-v6-lo" -j ACCEPT
          remove_owned_rule ip6tables "${tag}-v6-established" -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment "${tag}-v6-established" -j ACCEPT
          remove_owned_rule ip6tables "${tag}-v6-reject" -m comment --comment "${tag}-v6-reject" -j REJECT
